name: Create Release

# PoC for a Cloudflare bug bounty report. The only change that matters is that
# `pull_request` is added here: for that event GitHub runs the workflow file from
# the pull request, so the job body below is what runs, under this workflow's name.
on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Succeed
        run: echo "no-op so this run concludes successfully"
