name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [[ "${RELEASE_VERSION}" == v* ]]; then
            echo "Enter the release version without the v prefix." >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./packages/snippet/package.json').version")"
          REQUESTED_VERSION="${RELEASE_VERSION#v}"

          if [ "${REQUESTED_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Release version ${REQUESTED_VERSION} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Lint/format
        run: pnpm run check

      - name: Build library
        run: pnpm --filter @cloudflare/ai-search-snippet run build

      - name: Ensure tag exists (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          git fetch --tags

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "Tag ${TAG} points to ${TAG_SHA}, refusing to move it to ${HEAD_SHA}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Ensure GitHub release does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing GitHub release ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          overwrite_files: false
          files: |
            packages/snippet/dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
